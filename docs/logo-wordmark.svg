<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128"
     role="img" aria-label="vmjms - in-memory JMS provider">
  <title>vmjms</title>
  <style>
    .msg { animation: vmjms-drain 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    .msg-2 { animation-delay: .18s; }
    .msg-3 { animation-delay: .36s; }
    .arrow { animation: vmjms-nudge 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes vmjms-drain {
      0%,   100% { transform: translateX(0);    opacity: 1;   }
      42%        { transform: translateX(7px);  opacity: .35; }
      70%        { transform: translateX(-1px); opacity: 1;   }
    }
    @keyframes vmjms-nudge {
      0%,   100% { transform: translateX(0);   opacity: .95; }
      42%        { transform: translateX(5px); opacity: 1;   }
    }
    @media (prefers-reduced-motion: reduce) { .msg, .arrow { animation: none; } }
    .name { font: 700 58px/1 "Segoe UI", Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #1E1B4B; }
    .tag  { font: 400 19px/1 "Segoe UI", Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #6B7280; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #EDE9FE; }
      .tag  { fill: #A1A1AA; }
    }
  </style>
  <defs>
    <linearGradient id="vmjmsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <g fill="#6366F1">
    <rect x="22" y="2" width="9" height="12" rx="3"/>
    <rect x="43" y="2" width="9" height="12" rx="3"/>
    <rect x="64" y="2" width="9" height="12" rx="3"/>
    <rect x="85" y="2" width="9" height="12" rx="3"/>
  </g>
  <g fill="#9333EA">
    <rect x="22" y="114" width="9" height="12" rx="3"/>
    <rect x="43" y="114" width="9" height="12" rx="3"/>
    <rect x="64" y="114" width="9" height="12" rx="3"/>
    <rect x="85" y="114" width="9" height="12" rx="3"/>
  </g>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#vmjmsBg)"/>
  <g fill="#FFFFFF">
    <rect class="msg msg-1" x="28" y="42" width="48" height="11" rx="5.5"/>
    <rect class="msg msg-2" x="28" y="58.5" width="34" height="11" rx="5.5"/>
    <rect class="msg msg-3" x="28" y="75" width="20" height="11" rx="5.5"/>
  </g>
  <path class="arrow" d="M82 47.5 h10 M88 42.5 l6 5 -6 5" fill="none" stroke="#FFFFFF"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <text class="name" x="146" y="68">vmjms</text>
  <text class="tag"  x="149" y="95">in-memory JMS provider</text>
</svg>
