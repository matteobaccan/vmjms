<!DOCTYPE html>
<!--
  The default layout of jekyll-theme-primer 0.6.0, with the site title replaced
  by a navigation bar. The README already opens with its own title, so the theme's
  would show it twice; and the bar links the javadoc from every page, whatever the
  README of the published tag says.
-->
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <nav class="border-bottom border-gray-light pb-2 mb-4">
        <a href="{{ "/" | relative_url }}"><strong>{{ site.title }}</strong></a>
        &middot; <a href="{{ "/" | relative_url }}">Guide</a>
        &middot; <a href="{{ "/apidocs/" | relative_url }}">API reference (javadoc)</a>
        &middot; <a href="{{ site.github.repository_url }}">GitHub</a>
      </nav>

      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
